name: Integración continua

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    name: Pruebas (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Dependencias de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xfixes0 libdbus-1-3 fonts-dejavu-core

      - name: Pruebas del backend
        run: python tools/selftest.py

      - name: Pruebas de interfaz (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/gui_smoke.py

      - name: Guardar capturas
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/gui_smoke.py --capturas

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: capturas
          path: capturas/
          if-no-files-found: ignore
